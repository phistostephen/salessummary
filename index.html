<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Summary Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#f4f6f8,#eef1f5);color:#202124}
.app{max-width:1250px;margin:18px auto;padding:0 18px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.header h1{margin:0;font-size:22px}.header span{font-size:12px;color:#777}
.layout{display:grid;grid-template-columns:380px 1fr;gap:18px}
.panel,.preview{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 6px 22px #0000000a}
.panel{padding:17px}
.section-title{font-size:13px;font-weight:700;color:#555;margin:0 0 9px;text-transform:uppercase;letter-spacing:.5px}
.time-row{display:flex;gap:9px;margin-bottom:13px}
input{width:100%;height:38px;border:1px solid #dfe3e8;border-radius:9px;padding:0 11px;font-size:14px;background:#fafbfc;outline:none}
input:focus{border-color:#777;background:#fff}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:42px 1fr 1fr;align-items:center;gap:8px;padding:9px 10px;border:1px solid #eceef1;border-radius:12px;background:#fafafa}
.icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.gold{background:#fff4c7}.studded{background:#dff0ff}.silver{background:#eee8f7}
.card-name{font-size:13px;font-weight:700;margin-bottom:4px}
.field label{display:block;font-size:10px;color:#888;margin-bottom:3px}
.actions{display:flex;gap:8px;margin-top:13px}
button{flex:1;border:0;border-radius:9px;height:40px;font-size:13px;font-weight:700;cursor:pointer}
.primary{background:#202124;color:white}.secondary{background:#eef0f2;color:#222}
.preview{padding:12px;display:flex;align-items:center;justify-content:center;min-height:590px}
.canvas-wrap{width:100%;background:#f8f9fa;border-radius:12px;padding:8px;overflow:hidden}
canvas{display:block;width:100%;height:auto;background:#fff;border-radius:7px}
.note{font-size:10px;color:#888;margin-top:9px;text-align:center}
@media(max-width:850px){.layout{grid-template-columns:1fr}.preview{min-height:auto}.header{margin-bottom:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Sales Summary Generator</h1>
    <span>Live preview • PNG export</span>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="section-title">Summary Time</div>
      <div class="time-row"><input id="time" value="6:00 PM"></div>

      <div class="section-title">Sales Categories</div>
      <div class="cards">
        <div class="card">
          <div class="icon gold">🟡</div>
          <div class="field"><div class="card-name">Gold</div><label>Invoices</label><input id="goldInvoices" type="number" value="0"></div>
          <div class="field"><div class="card-name">&nbsp;</div><label>Turnover</label><input id="goldTurnover" value="₹0 Cr"></div>
        </div>

        <div class="card">
          <div class="icon studded">💎</div>
          <div class="field"><div class="card-name">Studded</div><label>Invoices</label><input id="studdedInvoices" type="number" value="0"></div>
          <div class="field"><div class="card-name">&nbsp;</div><label>Turnover</label><input id="studdedTurnover" value="₹0 Cr"></div>
        </div>

        <div class="card">
          <div class="icon silver">⚪</div>
          <div class="field"><div class="card-name">Silver</div><label>Invoices</label><input id="silverInvoices" type="number" value="0"></div>
          <div class="field"><div class="card-name">&nbsp;</div><label>Turnover</label><input id="silverTurnover" value="₹0 Cr"></div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" onclick="downloadImage()">⬇ Download PNG</button>
        <button class="secondary" onclick="resetData()">↺ Reset</button>
      </div>
      <div class="note">Totals are calculated automatically.</div>
    </div>

    <div class="preview">
      <div class="canvas-wrap"><canvas id="canvas" width="1200" height="700"></canvas></div>
    </div>
  </div>
</div>

<script>
const ids=["time","goldInvoices","goldTurnover","studdedInvoices","studdedTurnover","silverInvoices","silverTurnover"];
ids.forEach(id=>document.getElementById(id).addEventListener("input",draw));

function amount(v){
  v=v.replace(/[₹,\s]/g,"").toUpperCase();
  let n=parseFloat(v)||0;
  return v.includes("CR")?n:n/100;
}
function totalText(cr){return cr>=1?"₹"+cr.toFixed(2)+" Cr":"₹"+(cr*100).toFixed(2)+" L"}

function icon(ctx,type,x,y){
  if(type==="gold"){
    let g=ctx.createRadialGradient(x-8,y-8,2,x,y,22);
    g.addColorStop(0,"#fff8bd");g.addColorStop(.55,"#f5c400");g.addColorStop(1,"#d6a600");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();
  }else if(type==="silver"){
    let g=ctx.createRadialGradient(x-8,y-8,2,x,y,22);
    g.addColorStop(0,"#fff");g.addColorStop(.55,"#d8c9ed");g.addColorStop(1,"#b59bd8");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();
  }else{
    // Diamond icon for Studded
    const grad=ctx.createLinearGradient(x-20,y-18,x+20,y+18);
    grad.addColorStop(0,"#4fc3ff");
    grad.addColorStop(.45,"#168ee8");
    grad.addColorStop(1,"#075fc4");

    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(x-24,y-5);
    ctx.lineTo(x-13,y-17);
    ctx.lineTo(x+13,y-17);
    ctx.lineTo(x+24,y-5);
    ctx.lineTo(x,y+19);
    ctx.closePath();
    ctx.fill();

    // Diamond facets
    ctx.fillStyle="#8edbff";
    ctx.beginPath();
    ctx.moveTo(x-24,y-5);ctx.lineTo(x-13,y-17);ctx.lineTo(x-5,y-5);ctx.closePath();ctx.fill();

    ctx.fillStyle="#2aa8ef";
    ctx.beginPath();
    ctx.moveTo(x-13,y-17);ctx.lineTo(x+13,y-17);ctx.lineTo(x+5,y-5);ctx.lineTo(x-5,y-5);ctx.closePath();ctx.fill();

    ctx.fillStyle="#0b72d1";
    ctx.beginPath();
    ctx.moveTo(x-5,y-5);ctx.lineTo(x+5,y-5);ctx.lineTo(x,y+19);ctx.closePath();ctx.fill();

    ctx.fillStyle="#5fc9ff";
    ctx.beginPath();
    ctx.moveTo(x+13,y-17);ctx.lineTo(x+24,y-5);ctx.lineTo(x+5,y-5);ctx.closePath();ctx.fill();

    ctx.strokeStyle="#ffffffaa";
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(x-24,y-5);ctx.lineTo(x-13,y-17);ctx.lineTo(x+13,y-17);ctx.lineTo(x+24,y-5);
    ctx.lineTo(x,y+19);ctx.closePath();
    ctx.stroke();
  }
}

function draw(){
 const c=document.getElementById("canvas"),ctx=c.getContext("2d");
 ctx.clearRect(0,0,1200,700);ctx.fillStyle="#fff";ctx.fillRect(0,0,1200,700);

 const rows=[
  ["Gold","gold",+document.getElementById("goldInvoices").value||0,document.getElementById("goldTurnover").value||"₹0"],
  ["Studded","studded",+document.getElementById("studdedInvoices").value||0,document.getElementById("studdedTurnover").value||"₹0"],
  ["Silver","silver",+document.getElementById("silverInvoices").value||0,document.getElementById("silverTurnover").value||"₹0"]
 ];
 const totalInv=rows.reduce((a,r)=>a+r[2],0);
 const totalCr=rows.reduce((a,r)=>a+amount(r[3]),0);
 const time=document.getElementById("time").value||"6:00 PM";

 ctx.fillStyle="#222";ctx.font="bold 32px Arial";ctx.fillText(`Sales Summary (As on ${time})`,34,55);
 ctx.font="22px Arial";ctx.fillStyle="#333";
 ctx.fillText("Category",34,125);ctx.fillText("Invoices",510,125);ctx.fillText("Turnover",930,125);

 ctx.strokeStyle="#e5e5e5";ctx.lineWidth=1;
 [[34,470],[510,900],[930,1165]].forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(a,145);ctx.lineTo(b,145);ctx.stroke()});

 [205,310,415].forEach((y,i)=>{
   const r=rows[i];icon(ctx,r[1],56,y-3);
   ctx.fillStyle="#333";ctx.font="22px Arial";
   ctx.fillText(r[0],88,y+5);ctx.fillText(String(r[2]),510,y+5);ctx.fillText(r[3],930,y+5);
   if(i<2){
     ctx.strokeStyle="#e5e5e5";
     [[34,470],[510,900],[930,1165]].forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(a,y+48);ctx.lineTo(b,y+48);ctx.stroke()});
   }
 });
 ctx.strokeStyle="#ddd";ctx.beginPath();ctx.moveTo(34,485);ctx.lineTo(1165,485);ctx.stroke();
 ctx.fillStyle="#222";ctx.font="bold 22px Arial";
 ctx.fillText("Total Turnover",34,535);ctx.fillText(String(totalInv),510,535);ctx.fillText(totalText(totalCr),930,535);
}

function downloadImage(){
 draw();const c=document.getElementById("canvas"),a=document.createElement("a");
 a.download="Sales-Summary-"+document.getElementById("time").value.replace(/[^a-zA-Z0-9]/g,"-")+".png";
 a.href=c.toDataURL("image/png");a.click();
}
function resetData(){
 document.getElementById("time").value="6:00 PM";
 document.getElementById("goldInvoices").value=0;document.getElementById("goldTurnover").value="₹0 Cr";
 document.getElementById("studdedInvoices").value=0;document.getElementById("studdedTurnover").value="₹0 Cr";
 document.getElementById("silverInvoices").value=0;document.getElementById("silverTurnover").value="₹0 Cr";
 draw();
}
draw();
</script>
</body>
</html>
